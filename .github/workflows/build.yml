name: 构建 Windows exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        shell: pwsh
        run: |
          pip install pyinstaller uiautomation psutil winocr mss Pillow

      - name: 生成图标
        shell: pwsh
        run: python generate_icon.py

      - name: 打包为 exe
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --icon=app.ico --name WeChatChecker --add-data "config.json;." --add-data "wechat_ids.txt;." main.py

      - name: 复制配置文件
        shell: cmd
        run: |
          copy config.json dist\
          copy wechat_ids.txt dist\

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WeChatChecker-Windows
          path: dist/
